name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - master
      
  workflow_dispatch:

jobs:
  test-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x check_api.sh analyze_logs.sh

      - name: Check Bash syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh

      - name: Test API Monitoring Script
        run: ./check_api.sh https://httpbin.org
